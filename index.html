<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="奔虎电池匹配">
<meta name="theme-color" content="#f7f7f8">
<link rel="manifest" href="manifest.json">
<title>奔虎锂电 · 产品展示与车型电池智能匹配</title>
<style>
:root{
  --bg:#f7f7f8;--card:#ffffff;--border:#d9dadc;--fg:#33363b;--muted:#6b7077;
  --yellow:#e8b20a;--yellow-fg:#221d08;--yellow-soft:rgba(232,178,10,.12);
  --gray-start:#4a4f57;--gray-end:#767c84;
  --green:#16a34a;--green-bg:#dcfce7;
  --red:#dc2626;--red-bg:#fee2e2;
  --amber:#b45309;--amber-bg:#fef3c7;
  --blue:#2563eb;--blue-bg:#dbeafe;
  --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 6px 20px rgba(0,0,0,.05);
}
html.dark{
  --bg:#16161a;--card:#1f2025;--border:#2e3037;--fg:#e9e9ee;--muted:#9aa0a9;
  --yellow:#f0c33c;--yellow-fg:#231c04;--yellow-soft:rgba(240,195,60,.14);
  --gray-start:#a7adb8;--gray-end:#cdd2da;
  --green:#4ade80;--green-bg:rgba(74,222,128,.14);
  --red:#f87171;--red-bg:rgba(248,113,113,.14);
  --amber:#fbbf24;--amber-bg:rgba(251,191,36,.14);
  --blue:#60a5fa;--blue-bg:rgba(96,165,250,.14);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Microsoft YaHei','PingFang SC',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;line-height:1.55}
img{display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo-badge{width:34px;height:34px;border-radius:9px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--yellow-fg);box-shadow:0 2px 8px rgba(232,178,10,.35)}
.logo-name{font-weight:800;font-size:17px;letter-spacing:1px;background:linear-gradient(to right,var(--gray-start),var(--gray-end));-webkit-background-clip:text;background-clip:text;color:transparent}
.top-search{flex:1;min-width:200px;max-width:480px;position:relative}
.top-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.top-search input{width:100%;height:38px;padding:0 36px 0 34px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:14px;outline:none;transition:border-color .15s}
.top-search input:focus{border-color:var(--yellow)}
.top-search input::placeholder{color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-link{font-size:13px;color:var(--muted);padding:6px 10px;border-radius:8px;transition:all .15s}
.top-link:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
.icon-btn:hover{border-color:var(--yellow)}
/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;color:#fff;text-align:center}
.hero-bg{position:absolute;inset:0;background:url('assets/img/hero-bg.jpg') center 38%/cover no-repeat}
.hero-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,16,.62) 0%,rgba(10,12,16,.45) 55%,var(--bg) 100%)}
.hero-in{position:relative;max-width:1280px;margin:0 auto;padding:64px 16px 46px}
.hero h1{font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:3px;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero p{margin-top:10px;font-size:15px;opacity:.88;letter-spacing:1px}
.hero-stats{margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hstat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);border-radius:12px;padding:10px 20px;min-width:96px}
.hstat .n{font-size:24px;font-weight:800;color:var(--yellow)}
.hstat .l{font-size:12px;opacity:.85;margin-top:2px}
/* ===== 主体 ===== */
.container{max-width:1280px;margin:0 auto;padding:26px 16px 60px}
section.block{margin-bottom:34px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:21px;font-weight:800;letter-spacing:1px}
.sec-head .sub{font-size:13px;color:var(--muted)}
.sec-tag{display:inline-block;background:var(--yellow-soft);color:var(--yellow);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
/* ===== 搜索区 ===== */
.search-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-row .input-wrap{flex:1;min-width:230px;position:relative}
.search-row .input-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search-row input{width:100%;height:44px;padding:0 14px 0 38px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--fg);font-size:15px;outline:none;transition:border-color .15s}
.search-row input:focus{border-color:var(--yellow)}
.search-row select{height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--fg);font-size:14px;outline:none}
.btn{height:44px;padding:0 22px;border-radius:10px;border:none;font-size:14px;font-weight:700;transition:all .15s}
.btn-primary{background:var(--yellow);color:var(--yellow-fg);box-shadow:0 3px 10px rgba(232,178,10,.3)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--card);color:var(--fg);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--yellow);color:var(--yellow)}
.search-tip{margin-top:10px;font-size:12px;color:var(--muted)}
.search-tip b{color:var(--yellow);font-weight:600}
/* ===== 结果 ===== */
.result-summary{margin:16px 0 12px;font-size:14px;color:var(--muted)}
.result-summary strong{color:var(--yellow)}
.result-group-title{font-size:14px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.result-group-title::after{content:'';flex:1;height:1px;background:var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
/* ===== 车辆卡片 ===== */
.vcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.vcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1);border-color:var(--yellow)}
.vcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.vcard h3{font-size:16px}
.vcard .brand{font-size:12px;color:var(--muted);margin-top:2px}
.vspecs{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:12.5px;margin-top:10px}
.vspecs .lb{color:var(--muted)}
.vspecs .vl{font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-gray{background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--muted)}
.batt-list{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.batt-list .t{font-size:11px;color:var(--muted);margin-bottom:5px}
.batt-item{display:flex;align-items:center;gap:7px;font-size:12px;padding:3px 0;flex-wrap:wrap}
.batt-item .nm{font-weight:700;color:var(--yellow)}
.batt-item .sz{color:var(--muted);font-size:11px}
.batt-more{font-size:11px;color:var(--yellow);margin-top:3px}
/* ===== 产品卡片 ===== */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;transition:all .15s}
.chip:hover{border-color:var(--yellow);color:var(--yellow)}
.chip.active{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-fg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:16px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.12);border-color:var(--yellow)}
.pphoto{position:relative;height:190px;overflow:hidden;background:#2a2d34;flex-shrink:0}
.pphoto img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.pcard:hover .pphoto img{transform:scale(1.05)}
.photo-hint{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:4px 12px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(4px);pointer-events:none}
/* 占位图 */
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(140deg,#2a2d34 0%,#3d4149 55%,#33363d 100%);color:#fff;position:relative}
.ph::before{content:'';position:absolute;inset:0;background:radial-gradient(420px 130px at 50% -10%,rgba(232,178,10,.16),transparent)}
.ph .ph-model{font-size:23px;font-weight:800;letter-spacing:1px;color:#fff}
.ph .ph-eng{font-size:14px;font-weight:700;color:var(--yellow);letter-spacing:2px}
.ph .ph-dims{font-size:11.5px;color:rgba(255,255,255,.62);margin-top:3px}
.ph .ph-note{position:absolute;bottom:8px;font-size:10.5px;color:rgba(255,255,255,.5)}
.pbody{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pbody h3{font-size:16.5px;font-weight:800}
.pbody .pmodel{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.pspecs{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}
.pspecs .lb{color:var(--muted)}
.pspecs .vl{font-weight:600}
.pfunc{font-size:12px;color:var(--muted)}
.pfunc em{font-style:normal;color:var(--yellow);font-weight:600}
.plinks{display:flex;gap:8px;flex-wrap:wrap}
.plink{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:8px;border:1px solid var(--border);color:var(--muted);transition:all .15s}
.plink:hover{border-color:var(--gray-end);color:var(--fg)}
.click-hint{margin-top:auto;padding-top:9px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.click-hint b{color:var(--yellow);font-weight:700}
.empty{background:var(--card);border:1.5px dashed var(--border);border-radius:var(--radius);padding:44px 16px;text-align:center;color:var(--muted)}
.empty .ic{font-size:34px;margin-bottom:8px}
/* ===== 弹窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:960px;width:100%;padding:22px;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal .close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;border:none;background:var(--bg);color:var(--fg);font-size:15px;display:flex;align-items:center;justify-content:center}
.modal .close:hover{background:var(--red);color:#fff}
.modal h2{font-size:20px;padding-right:44px}
.modal .m-sub{font-size:13px;color:var(--muted);margin:4px 0 14px}
.bm-top{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:16px;margin-bottom:18px}
.bm-photo{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#2a2d34;min-height:220px}
.bm-photo img{width:100%;height:100%;object-fit:cover}
.bm-photo .ph{min-height:220px}
.bm-side{display:flex;flex-direction:column;gap:12px}
.bm-params{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;font-size:13px}
.bm-params .lb{color:var(--muted)}
.bm-params .vl{font-weight:600}
.bm-pdfs{display:flex;gap:10px;flex-wrap:wrap}
.bm-pdfs a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 16px;border-radius:9px;background:var(--gray-start);color:#fff;transition:filter .15s}
.bm-pdfs a:hover{filter:brightness(1.15)}
.matches-title{font-size:15px;font-weight:700;margin:16px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.matches-title::after{content:'';flex:1;height:1px;background:var(--border)}
.vm-list{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;padding-right:4px}
.vm-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:color-mix(in srgb,var(--bg) 60%,transparent);flex-wrap:wrap}
.vm-item .info{flex:1;min-width:200px}
.vm-item .nm{font-weight:700;font-size:14px}
.vm-item .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.vm-item .dims{font-size:12px;color:var(--muted);white-space:nowrap}
.mt-note{margin-top:10px;font-size:12px;color:var(--amber)}
/* ===== 页脚 ===== */
.footer{border-top:1px solid var(--border);padding:26px 16px 40px;text-align:center;font-size:12.5px;color:var(--muted)}
.footer a{color:var(--yellow)}
.footer .row{margin-top:6px}
/* ===== 响应式 ===== */
@media(max-width:720px){
  .bm-top{grid-template-columns:1fr}
  .hero-in{padding:44px 14px 34px}
  .grid{grid-template-columns:1fr}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .pphoto{height:140px}
  .pspecs{grid-template-columns:1fr}
  .top-search{order:3;flex-basis:100%;max-width:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="#top">
      <span class="logo-badge">⚡</span>
      <span class="logo-name">奔虎锂电</span>
    </a>
    <div class="top-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="searchTop" placeholder="搜索车型 / 电池型号，如：NX、M95c、AE5、6435…">
    </div>
    <div class="top-actions">
      <a class="top-link" href="#match">智能匹配</a>
      <a class="top-link" href="#products">产品展示</a>
      <button class="icon-btn" id="themeBtn" title="切换明暗主题">🌓</button>
    </div>
  </div>
</header>

<div id="top"></div>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-mask"></div>
  <div class="hero-in">
    <h1>奔虎锂电 · <em>产品展示</em></h1>
    <p>磷酸铁锂(LFP)电池专家 · 为二轮电动车提供安全、长续航的电池方案</p>
    <div class="hero-stats" id="heroStats"></div>
  </div>
</section>

<main class="container">
  <section class="block" id="match">
    <div class="sec-head">
      <h2>🔍 智能匹配</h2>
      <span class="sec-tag">车型 ⇄ 电池</span>
      <span class="sub">输入车型秒出可装电池 · 输入电池型号查看适配车型</span>
    </div>
    <div class="search-card">
      <div class="search-row">
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="searchMain" placeholder="输入车型或电池型号，如：NX、M95c、AE5、领跑400、6435…">
        </div>
        <select id="brandFilter"><option value="">全部品牌</option></select>
        <button class="btn btn-primary" onclick="doSearch()">搜 索</button>
        <button class="btn btn-ghost" onclick="resetSearch()">重 置</button>
      </div>
      <div class="search-tip">💡 车型示例：<b>NX Sport</b>、<b>M95c</b>、<b>AE5</b>、<b>苍穹酷版</b>；电池示例：<b>6435</b>、<b>7650</b>、<b>76.8V</b>。也可以只输入品牌名，如 <b>九号</b>、<b>小牛</b>。</div>
    </div>
    <div class="result-summary" id="resultSummary"></div>
    <div id="matchGrid"></div>
    <div class="empty" id="emptyState" style="display:none">
      <div class="ic">🔍</div>
      <p>未找到匹配结果，试试其他关键词</p>
    </div>
  </section>

  <section class="block" id="products">
    <div class="sec-head">
      <h2>⚡ 产品展示</h2>
      <span class="sec-tag">共 <span id="prodCount"></span> 款</span>
      <span class="sub">点击产品图片，查看该电池可匹配的车型</span>
    </div>
    <div class="chips" id="prodChips">
      <button class="chip active" data-v="">全部</button>
      <button class="chip" data-v="64">64V 系列</button>
      <button class="chip" data-v="76.8">76.8V 系列</button>
    </div>
    <div class="pgrid" id="prodGrid"></div>
  </section>
</main>

<footer class="footer">
  <div>奔虎锂电 · 产品展示与智能匹配系统 v3.0 | 数据持续更新 | <a href="javascript:void(0)" onclick="showDataInfo()">📋 数据来源说明</a></div>
  <div class="row">备案信息 · 技术支持：比克新动力</div>
</footer>

function bindEvents(){
  document.getElementById('searchMain').addEventListener('input', function(){
    document.getElementById('searchTop').value = this.value;
    curQuery = this.value.trim();
    runSearch();
  });
  document.getElementById('searchMain').addEventListener('keypress', function(e){ if (e.key === 'Enter') runSearch(); });
  document.getElementById('searchTop').addEventListener('input', function(){
    document.getElementById('searchMain').value = this.value;
    curQuery = this.value.trim();
    runSearch();
    if (this.value.trim()) document.getElementById('match').scrollIntoView({behavior:'smooth'});
  });
  document.getElementById('brandFilter').addEventListener('change', runSearch);
  document.getElementById('prodChips').addEventListener('click', function(e){
    var chip = e.target.closest('.chip'); if (!chip) return;
    this.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
    chip.classList.add('active');
    renderProducts(chip.dataset.v);
  });
  document.getElementById('overlay').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeModal();
    if (e.ctrlKey && e.key === 'k') { e.preventDefault(); document.getElementById('searchMain').focus(); }
  });
  var saved = localStorage.getItem('theme');
  if (saved === 'dark') document.documentElement.classList.add('dark');
  document.getElementById('themeBtn').addEventListener('click', function(){
    var dark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  });
}

/* ===== 匹配核心 ===== */
function checkFit(battery, vehicle){
  // 电池可任意姿态安装：立装 / 平放 / 侧放，6 种旋转逐一尝试
  var D = [battery.长_mm || 0, battery.宽_mm || 0, battery.高_mm || 0];
  var V = [vehicle.电池仓_长_mm || 0, vehicle.电池仓_宽_mm || 0, vehicle.电池仓_高_mm || 0];
  var narrow = vehicle.电池仓_宽窄处_mm || 0;
  var perms = [];
  [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]].forEach(function(p){
    var d = [D[p[0]], D[p[1]], D[p[2]]];
    var key = d.join('x');
    if (!perms.some(function(x){ return x.key === key; })) perms.push({ d: d, laid: p[2] !== 2, key: key });
  });
  perms.sort(function(a, b){ return (a.laid ? 1 : 0) - (b.laid ? 1 : 0); });
  var fitPerm = null, reasons = [], bestOver = Infinity;
  for (var i = 0; i < perms.length; i++) {
    var d = perms[i].d;
    if (d[0] <= V[0] && d[1] <= V[1] && d[2] <= V[2] && (!narrow || d[1] <= narrow)) { fitPerm = perms[i]; break; }
    var over = [d[0]-V[0], d[1]-V[1], d[2]-V[2]].map(function(x){ return x > 0 ? x : 0; });
    var total = over[0] + over[1] + over[2] + (narrow && d[1] > narrow ? 10000 : 0);
    if (total < bestOver) {
      bestOver = total;
      reasons = [];
      if (over[0]) reasons.push('长度超限(' + d[0] + '>' + V[0] + 'mm)');
      if (over[1]) reasons.push('宽度超限(' + d[1] + '>' + V[1] + 'mm)');
      if (over[2]) reasons.push('高度超限(' + d[2] + '>' + V[2] + 'mm)');
      if (narrow && d[1] > narrow) reasons.push('宽度超窄处限制');
    }
  }
  var sizeFit = !!fitPerm;
  var vSpec = (vehicle.原厂电池规格 || '').toLowerCase();
  var vm = vSpec.match(/(\d+)\s*v/);
  var vVolt = vm ? parseInt(vm[1]) : 0;
  var battVolt = battery.电压_V || 0;
  var voltOk = true;
  if (vVolt === 60 && battVolt !== 64) { voltOk = false; reasons.push('电压不匹配：60V原厂需用64V锂电'); }
  if (vVolt === 72 && battVolt !== 76.8) { voltOk = false; reasons.push('电压不匹配：72V原厂需用76.8V锂电'); }
  if (vVolt === 48 && battVolt !== 64) { voltOk = false; reasons.push('电压不匹配：48V原厂需用64V锂电'); }
  var battMaxPwr = battery.适用电机功率_最大_W || 99999;
  var vehPwr = vehicle.电机_额定功率_W || 0;
  var powerFit = vehPwr <= battMaxPwr;
  var level = (sizeFit && voltOk) ? (powerFit ? '完美匹配' : '尺寸合适(功率需确认)') : (sizeFit && !voltOk ? '电压不匹配' : '尺寸不匹配');
  var fits = sizeFit && voltOk;
  return { fits: fits, powerFit: powerFit, voltOk: voltOk, fitLevel: level, reasons: reasons,
           laid: fitPerm ? fitPerm.laid : false, installDims: fitPerm ? fitPerm.d.join('×') : '' };
}

function matchBatteryToVehicles(battery){
  return allVehicles.map(function(v){
    var r = checkFit(battery, v); r.vehicle = v; return r;
  }).sort(function(a, b){
    var o = {'完美匹配':0, '尺寸合适(功率需确认)':1, '尺寸不匹配':2, '电压不匹配':3};
    return (o[a.fitLevel] === undefined ? 4 : o[a.fitLevel]) - (o[b.fitLevel] === undefined ? 4 : o[b.fitLevel]);
  });
}

function matchVehicleToBatteries(vehicle){
  return allBatteries.map(function(b){
    var r = checkFit(b, vehicle); r.battery = b; return r;
  }).sort(function(a, b){
    var o = {'完美匹配':0, '尺寸合适(功率需确认)':1, '尺寸不匹配':2, '电压不匹配':3};
    return (o[a.fitLevel] === undefined ? 4 : o[a.fitLevel]) - (o[b.fitLevel] === undefined ? 4 : o[b.fitLevel]);
  });
}

function fitBadge(level){
  if (level === '完美匹配') return '<span class="badge badge-green">✅ 完美匹配</span>';
  if (level === '尺寸合适(功率需确认)') return '<span class="badge badge-amber">⚠️ 尺寸合适(功率需确认)</span>';
  return '<span class="badge badge-red">✖ ' + level + '</span>';
}

/* ===== 统一搜索 ===== */
function runSearch(){
  var q = curQuery.toLowerCase();
  var grid = document.getElementById('matchGrid');
  var summary = document.getElementById('resultSummary');
  var empty = document.getElementById('emptyState');
  if (!q) {
    summary.innerHTML = '';
    grid.innerHTML = '';
    empty.style.display = 'none';
    return;
  }
  var brand = document.getElementById('brandFilter').value;
  var battRes = allBatteries.filter(function(b){
    return (b.型号 + ' ' + b.展示名 + ' ' + b.电压_V + 'V ' + b.容量_Ah + 'Ah ' + b.电量_Wh + 'Wh ' + (b.壳体材质 || '')).toLowerCase().indexOf(q) >= 0;
  });
  var vehRes = allVehicles.filter(function(v){
    if (brand && v._brand.indexOf(brand) < 0) return false;
    return (v._brand + ' ' + v.型号 + ' ' + (v.类型 || '') + ' ' + (v.备注 || '') + ' ' + (v.原厂电池规格 || '')).toLowerCase().indexOf(q) >= 0;
  });
  var html = '';
  if (vehRes.length) {
    html += '<div class="result-group-title">🚗 匹配车型 <span class="badge badge-gray">' + vehRes.length + ' 款</span></div><div class="grid">' + vehRes.map(vehicleCardHTML).join('') + '</div>';
  }
  if (battRes.length) {
    html += '<div class="result-group-title">🔋 匹配电池 <span class="badge badge-gray">' + battRes.length + ' 款</span>，点击图片查看可匹配车型</div><div class="pgrid">' + battRes.map(function(b){
      return productCardHTML(b, allBatteries.indexOf(b));
    }).join('') + '</div>';
  }
  if (html) {
    summary.innerHTML = '找到 <strong>' + vehRes.length + '</strong> 款车型、<strong>' + battRes.length + '</strong> 款电池';
    empty.style.display = 'none';
  } else {
    summary.innerHTML = '';
    empty.style.display = 'block';
  }
  grid.innerHTML = html;
}

  var src = v.数据来源 || '网络收集', conf = v.可信度 || '中';
  var confBadge = conf === '高' ? '<span class="badge badge-green">' + conf + '可信</span>' : (conf === '低' ? '<span class="badge badge-red">' + conf + '可信</span>' : '<span class="badge badge-amber">' + conf + '可信</span>');
  var br = matchVehicleToBatteries(v);
  var fitBatt = br.filter(function(r){ return r.fits; });
  var perfect = br.filter(function(r){ return r.fitLevel === '完美匹配'; });
  var battHTML = fitBatt.length
    ? fitBatt.slice(0, 3).map(function(r){

        return '<div class="batt-item"><span class="nm">' + b.展示名 + '</span> ' + b.电压_V + 'V' + b.容量_Ah + 'Ah <span class="sz">' + (r.laid ? '<span class="badge badge-blue">平放</span> ' : '') + r.installDims + 'mm</span> ' + fitBadge(r.fitLevel) + '</div>';
      }).join('') + (fitBatt.length > 3 ? '<div class="batt-more">+ ' + (fitBatt.length - 3) + ' 款更多，点击查看全部 →</div>' : '')
    : '<div class="batt-item" style="color:var(--red)">⚠️ 暂无匹配电池</div>';
  return '<div class="vcard" onclick="showVehicleModal(\'' + v._brand.replace(/'/g, "\\'") + '\',\'' + v.型号.replace(/'/g, "\\'") + '\')">' +
    '<div class="vcard-top"><div><h3>' + v.型号 + '</h3><div class="brand">' + brandShort + ' · ' + (v.类型 || '') + ' · ' + src + '</div></div>' + pwrTag + '</div>' +
    '<div class="vspecs">' +
      '<div><span class="lb">电池仓：</span><span class="vl">' + (v.电池仓_长_mm || '-') + '×' + (v.电池仓_宽_mm || '-') + '×' + (v.电池仓_高_mm || '-') + ' mm</span></div>' +
      '<div><span class="lb">电机功率：</span><span class="vl">' + pwr + 'W' + (v.电机_峰值功率_W ? ' / 峰值' + v.电机_峰值功率_W + 'W' : '') + '</span></div>' +
      '<div><span class="lb">原厂电池：</span><span class="vl">' + (v.原厂电池规格 || '-') + '</span></div>' +
      '<div><span class="lb">可信度：</span><span class="vl">' + confBadge + '</span></div>' +
    '</div>' +
    (v.备注 ? '<div style="margin-top:8px;font-size:11.5px;color:var(--muted)">💡 ' + v.备注 + '</div>' : '') +
    '<div class="batt-list"><div class="t">🔋 可装奔虎电池：<b style="color:var(--yellow)">' + fitBatt.length + ' 款</b>' + (perfect.length ? '（' + perfect.length + ' 款完美）' : '') + '</div>' + battHTML + '</div>' +
  '</div>';
}

function doSearch(){
  curQuery = document.getElementById('searchMain').value.trim();
  document.getElementById('searchTop').value = curQuery;
  runSearch();
}

function resetSearch(){
  curQuery = '';
  document.getElementById('searchMain').value = '';
  document.getElementById('searchTop').value = '';
  document.getElementById('brandFilter').value = '';
  runSearch();
}

function showDataInfo(){
  alert('数据来源说明：\n高可信 = 多源验证 / 官方参数 / 经销商数据\n中可信 = 单源实测 / 车友实测\n数据来源：品牌官方参数 + 车友实测 + 经销商 + 网络收集\n电池数据更新时间：' + (BATTERIES.length ? '见 batteries.json' : '') + '\n来电咨询：奔虎锂电');
}

init();
</script>
